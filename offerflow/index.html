<script>
(()=>{'use strict';const KEY='offerflow_v01_data';const statuses=['待投递','已投递','笔试','面试','Offer','已结束'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);const today=()=>new Date().toLocaleDateString('en-CA');const offset=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};let data;let page='dashboard';const $=s=>document.querySelector(s);function seed(){const mk=(company,role,status,channel,day,follow)=>({id:id(),company,role,status,channel,applied:offset(day),followup:follow==null?'':offset(follow),url:'',notes:'演示数据',history:[{status,date:offset(day)}]});const jobs=[mk('星河科技','产品实习生','已投递','Boss直聘',-8,2),mk('远山数据','数据产品实习生','面试','企业官网',-14,1),mk('晴空互动','AI 产品实习生','笔试','内推',-6,3),mk('云杉网络','用户产品实习生','待投递','实习僧',0,null),mk('蓝鲸科技','产品助理','已结束','Boss直聘',-25,null),mk('晨光软件','产品运营实习生','Offer','牛客',-32,null)];return {jobs,tasks:[{id:id(),text:'准备远山数据面试',jobId:jobs[1].id,due:offset(1),done:false},{id:id(),text:'跟进星河科技投递进度',jobId:jobs[0].id,due:offset(2),done:false},{id:id(),text:'复盘晴空互动笔试题',jobId:jobs[2].id,due:offset(-1),done:false}]}}function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.jobs)&&Array.isArray(v.tasks))return v}catch(e){}return seed()}data=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('保存失败：浏览器可能禁用了本地存储。请尝试使用 Chrome 或 Edge 正常窗口打开，并检查浏览器存储权限。');console.error('OfferFlow save error:',e);return false}}const labelJob=j=>j?`${j.company} · ${j.role}`:'未关联岗位';const findJob=x=>data.jobs.find(j=>j.id===x);const stat=s=>data.jobs.filter(j=>j.status===s).length;const appliedJobs=()=>data.jobs.filter(j=>j.status!=='待投递');const activeTasks=()=>data.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));function badge(s){return `<span class="tag status-${esc(s)}">${esc(s)}</span>`}function rowJob(j){return `<div class="listrow"><div><strong>${esc(j.company)}</strong><div class="muted">${esc(j.role)} · ${esc(j.channel)}</div></div>${badge(j.status)}</div>`}function taskRow(t){const j=findJob(t.jobId),over=t.due&&t.due<today()&&!t.done;return `<div class="listrow"><div style="display:flex;gap:12px;align-items:flex-start"><input type="checkbox" class="check" data-toggle-task="${esc(t.id)}" ${t.done?'checked':''}><div><div class="${t.done?'taskdone':''}">${esc(t.text)}</div><div class="muted">${esc(labelJob(j))} · ${t.due?esc(t.due):'无截止日期'} ${over?'<span class="overdue">· 已逾期</span>':''}</div></div></div><div><button class="smallbtn" data-edit-task="${esc(t.id)}">编辑</button><button class="smallbtn" data-del-task="${esc(t.id)}">删除</button></div></div>`}function dashboard(){const jobs=appliedJobs();return `<div class="cards"><div class="card"><div class="label">累计投递</div><div class="number">${jobs.length}</div><div class="muted">不含待投递</div></div><div class="card"><div class="label">笔试 / 面试中</div><div class="number">${stat('笔试')+stat('面试')}</div><div class="muted">当前进行中</div></div><div class="card"><div class="label">已获 Offer</div><div class="number">${stat('Offer')}</div><div class="muted">当前状态</div></div><div class="card"><div class="label">未完成待办</div><div class="number">${activeTasks().length}</div><div class="muted">其中逾期 ${activeTasks().filter(t=>t.due&&t.due<today()).length} 项</div></div></div><div class="layout2"><div class="panel"><h2>近期岗位</h2>${data.jobs.length?data.jobs.slice().reverse().slice(0,6).map(rowJob).join(''):'<div class="empty">暂无岗位，点击右上角新增</div>'}</div><div class="panel"><h2>下一步行动</h2>${activeTasks().length?activeTasks().slice(0,5).map(taskRow).join(''):'<div class="empty">所有待办已完成</div>'}<button class="btn" data-add-task style="margin-top:14px">＋ 新增待办</button></div></div>`}function jobsPage(){return `<div class="toolbar"><input class="field grow" id="searchJobs" placeholder="搜索公司或岗位名称"><select class="field" id="filterStatus"><option value="">全部状态</option>${statuses.map(s=>`<option>${s}</option>`).join('')}</select><button class="btn" data-add-job>＋ 新增岗位</button></div><div class="panel tablewrap"><table class="tbl"><thead><tr><th>公司 / 岗位</th><th>渠道</th><th>状态</th><th>投递日期</th><th>跟进日期</th><th>操作</th></tr></thead><tbody id="jobRows"></tbody></table></div>`}function fillJobRows(){const q=($('#searchJobs')?.value||'').trim().toLowerCase(),s=$('#filterStatus')?.value||'';const jobs=data.jobs.filter(j=>(!s||j.status===s)&&(!q||(j.company+' '+j.role).toLowerCase().includes(q)));$('#jobRows').innerHTML=jobs.length?jobs.map(j=>`<tr><td><strong>${esc(j.company)}</strong><div class="muted">${esc(j.role)}</div></td><td>${esc(j.channel)}</td><td>${badge(j.status)}</td><td>${esc(j.applied||'—')}</td><td>${esc(j.followup||'—')}</td><td><button class="smallbtn" data-edit-job="${esc(j.id)}">编辑</button><button class="smallbtn" data-del-job="${esc(j.id)}">删除</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">没有符合条件的岗位</td></tr>'}function board(){return `<p class="muted">点击岗位卡片编辑信息与状态。状态变更会写入岗位历史记录。</p><div class="board">${statuses.map(s=>`<div class="lane"><h3>${s} <span class="muted">(${stat(s)})</span></h3>${data.jobs.filter(j=>j.status===s).map(j=>`<div class="jobcard" data-edit-job="${esc(j.id)}"><strong>${esc(j.company)}</strong><div class="muted">${esc(j.role)}</div><small>${esc(j.applied||'尚未填写日期')}</small></div>`).join('')||'<div class="muted">暂无岗位</div>'}</div>`).join('')}</div>`}function tasks(){return `<div class="toolbar"><button class="btn primary" data-add-task>＋ 新增待办</button><select class="field" id="taskFilter"><option value="all">全部任务</option><option value="pending">未完成</option><option value="done">已完成</option></select></div><div class="panel" id="taskRows"></div>`}function fillTasks(){let f=$('#taskFilter')?.value||'all';let arr=data.tasks.filter(t=>f==='all'||(f==='done'?t.done:!t.done)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));$('#taskRows').innerHTML=arr.length?arr.map(taskRow).join(''):'<div class="empty">当前没有任务</div>'}function analytics(){let arr=appliedJobs();let channels=[...new Set(data.jobs.map(j=>j.channel))];function bars(entries,total){return entries.map(([name,num])=>`<div class="chartrow"><span>${esc(name)}</span><div class="progress"><div class="bar" style="width:${total?Math.round(num/total*100):0}%"></div></div><strong>${num}</strong></div>`).join('')}return `<div class="cards"><div class="card"><div class="label">已投递岗位</div><div class="number">${arr.length}</div></div><div class="card"><div class="label">笔试或面试阶段</div><div class="number">${stat('笔试')+stat('面试')}</div></div><div class="card"><div class="label">Offer 数量</div><div class="number">${stat('Offer')}</div></div><div class="card"><div class="label">已结束岗位</div><div class="number">${stat('已结束')}</div></div></div><div class="layout2"><div class="panel"><h2>当前阶段分布</h2>${bars(statuses.map(s=>[s,stat(s)]),data.jobs.length)||'<div class="empty">暂无数据</div>'}</div><div class="panel"><h2>投递渠道分布</h2>${channels.length?bars(channels.map(c=>[c,arr.filter(j=>j.channel===c).length]),arr.length):'<div class="empty">暂无数据</div>'}<p class="hint">仅统计已投递岗位；渠道表现不等于平台效果，样本量少时不宜据此下结论。</p></div></div><div class="panel" style="margin-top:16px"><h2>指标说明</h2><p class="hint">“累计投递”排除待投递状态；“笔试 / 面试中”只计算当前处于这些阶段的岗位；本版不推断实际回复率、面试转化率或录用概率。若岗位状态变更为“已结束”，历史面试经历仍可在状态记录中保留，但不计入当前面试阶段。</p></div>`}const titles={dashboard:['工作台','让每一次投递都有迹可循'],jobs:['岗位管理','集中记录和维护你的岗位信息'],board:['投递看板','清晰查看每个岗位的当前进度'],tasks:['待办中心','把求职计划转化为具体行动'],analytics:['数据分析','用实际记录了解求职进展']};function render(){let [title,sub]=titles[page];$('#pageTitle').textContent=title;$('#subtitle').textContent=sub;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));$('#content').innerHTML=({dashboard,jobs:jobsPage,board,tasks,analytics})[page]();if(page==='jobs')fillJobRows();if(page==='tasks')fillTasks()}function openModal(which){$(which).classList.add('open')}function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'))}function openJob(j){$('#jobForm').reset();$('#jobId').value=j?.id||'';$('#jobModalTitle').textContent=j?'编辑岗位':'新增岗位';$('#jobHistory').innerHTML=j&&Array.isArray(j.history)&&j.history.length?'<strong>状态变更记录</strong><div>'+j.history.map(h=>esc(h.date||'')+' · '+esc(h.status||'')).join(' → ')+'</div>':'';for(const k of ['company','role','channel','status','applied','followup','url','notes'])if(j)$('#'+k).value=j[k]||'';openModal('#jobModal')}function openTask(t){$('#taskForm').reset();$('#taskId').value=t?.id||'';$('#taskModalTitle').textContent=t?'编辑待办':'新增待办';$('#taskJob').innerHTML='<option value="">不关联岗位</option>'+data.jobs.map(j=>`<option value="${esc(j.id)}">${esc(labelJob(j))}</option>`).join('');if(t){$('#taskText').value=t.text;$('#taskJob').value=t.jobId||'';$('#taskDue').value=t.due||''}openModal('#taskModal')}document.addEventListener('click',e=>{let n=e.target.closest('button,[data-edit-job]');if(!n)return;if(n.dataset.page){page=n.dataset.page;render()}else if(n.hasAttribute('data-add-job')||n.id==='addJobTop')openJob();else if(n.hasAttribute('data-add-task'))openTask();else if(n.dataset.editJob){openJob(findJob(n.dataset.editJob))}else if(n.dataset.delJob){let j=findJob(n.dataset.delJob);if(j&&confirm(`确定删除「${labelJob(j)}」吗？关联待办将保留但解除关联。`)){data.jobs=data.jobs.filter(x=>x.id!==j.id);data.tasks.forEach(t=>{if(t.jobId===j.id)t.jobId=''});save();render()}}else if(n.dataset.editTask){openTask(data.tasks.find(t=>t.id===n.dataset.editTask))}else if(n.dataset.delTask){if(confirm('确定删除这项待办吗？')){data.tasks=data.tasks.filter(t=>t.id!==n.dataset.delTask);save();render()}}else if(n.hasAttribute('data-close'))closeModals()});document.querySelectorAll('.nav').forEach(n=>n.addEventListener('click',()=>{page=n.dataset.page;render()}));$('#content').addEventListener('input',e=>{if(e.target.id==='searchJobs')fillJobRows()});$('#content').addEventListener('change',e=>{if(e.target.id==='filterStatus')fillJobRows();if(e.target.id==='taskFilter')fillTasks();if(e.target.dataset.toggleTask){let t=data.tasks.find(x=>x.id===e.target.dataset.toggleTask);if(t){t.done=e.target.checked;save();render()}}});$('#jobForm').addEventListener('submit',e=>{e.preventDefault();try{if(!e.currentTarget.reportValidity())return;let jid=$('#jobId').value;let old=findJob(jid);let fields={};for(let k of ['company','role','channel','status','applied','followup','url','notes'])fields[k]=$('#'+k).value.trim();if(!fields.company||!fields.role){alert('请填写必填项：公司名称和岗位名称。');return}let history=old?.history||[];if(!old||old.status!==fields.status)history=[...history,{status:fields.status,date:today()}];if(old)Object.assign(old,fields,{history});else data.jobs.push({id:id(),...fields,history});if(!save())return;closeModals();render();alert('岗位已成功保存！')}catch(err){console.error('OfferFlow job save error:',err);alert('岗位保存时出现错误：'+(err?.message||String(err))+'。请截图或记下这条提示。')}});$('#taskForm').addEventListener('submit',e=>{e.preventDefault();let tid=$('#taskId').value;let old=data.tasks.find(t=>t.id===tid);let fields={text:$('#taskText').value.trim(),jobId:$('#taskJob').value,due:$('#taskDue').value};if(!fields.text)return;if(old)Object.assign(old,fields);else data.tasks.push({id:id(),...fields,done:false});save();closeModals();render()});$('#exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,...data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='OfferFlow_备份_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('#importBtn').addEventListener('click',()=>$('#fileInput').click());$('#fileInput').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件过大');let v=JSON.parse(await f.text());if(!Array.isArray(v.jobs)||!Array.isArray(v.tasks)||v.jobs.length>10000||v.tasks.length>20000)throw Error('备份结构不正确');for(let j of v.jobs)if(!j||typeof j.id!=='string'||typeof j.company!=='string'||typeof j.role!=='string'||!statuses.includes(j.status))throw Error('岗位字段不正确');for(let t of v.tasks)if(!t||typeof t.id!=='string'||typeof t.text!=='string')throw Error('待办字段不正确');if(confirm('导入会覆盖当前所有岗位和待办。请确认已经导出备份，是否继续？')){data={jobs:v.jobs,tasks:v.tasks};save();render();alert('导入成功')}}catch(err){alert('导入失败：'+err.message)}e.target.value=''});document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModals()}));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals()});save();render()})();
</script><script>
(()=>{'use strict';
const KEY='offerflow_v01_data',stack=document.querySelector('#toastStack');
const notify=(message,type='success')=>{if(!stack)return;const item=document.createElement('div');item.className='toast '+type;item.textContent=message;stack.appendChild(item);setTimeout(()=>{item.style.opacity='0';item.style.transform='translateY(8px)';setTimeout(()=>item.remove(),180)},2600)};
window.alert=message=>notify(String(message),/失败|错误|请填写/.test(String(message))?'error':'success');
document.querySelectorAll('.dialog').forEach((dialog,index)=>{dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-labelledby',index?'taskModalTitle':'jobModalTitle')});
const readData=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};
const enhanceHistory=()=>{const box=document.querySelector('#jobHistory'),jobId=document.querySelector('#jobId')?.value,state=readData(),job=state?.jobs?.find(j=>j.id===jobId);if(!box||!job||!Array.isArray(job.history)||!job.history.length)return;box.classList.add('history');const entries=job.history.map(h=>`<span class="historyitem">${String(h.date||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} · ${String(h.status||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</span>`).join('');const canRollback=job.history.length>1;box.innerHTML=`<strong>状态变更记录</strong><div class="historyline">${entries}${canRollback?`<button type="button" class="smallbtn" data-rollback-job="${job.id}">回退上次状态</button>`:''}</div>`};
document.addEventListener('submit',e=>{const button=e.target.querySelector('button[type="submit"]');if(!button)return;const original=button.textContent;button.disabled=true;button.textContent='保存中…';setTimeout(()=>{button.disabled=false;button.textContent=original;if(e.target.id==='taskForm'&&!e.target.closest('.modal')?.classList.contains('open'))notify('待办已保存')},180)},true);
document.addEventListener('click',e=>{const target=e.target.closest('button,[data-edit-job]');if(!target)return;if(target.dataset.page){const content=document.querySelector('#content');content?.classList.add('content-loading');requestAnimationFrame(()=>requestAnimationFrame(()=>content?.classList.remove('content-loading')))}if(target.dataset.editJob)setTimeout(enhanceHistory,0);if(target.dataset.rollbackJob){const state=readData(),job=state?.jobs?.find(j=>j.id===target.dataset.rollbackJob);if(!job||!Array.isArray(job.history)||job.history.length<2)return;const previous=job.history[job.history.length-2]?.status;if(!previous||!confirm(`将岗位状态回退到「${previous}」吗？`))return;job.status=previous;job.history.push({status:previous,date:new Date().toLocaleDateString('en-CA'),rollback:true});try{localStorage.setItem(KEY,JSON.stringify(state));notify('状态已回退，正在刷新');setTimeout(()=>location.reload(),450)}catch(err){notify('状态回退失败，请检查浏览器存储权限','error')}}if(target.dataset.delJob||target.dataset.delTask){const before=localStorage.getItem(KEY);setTimeout(()=>{if(localStorage.getItem(KEY)!==before)notify(target.dataset.delJob?'岗位已删除，关联待办已保留':'待办已删除')},0)}},false);
document.addEventListener('change',e=>{if(e.target.matches('[data-toggle-task]'))notify(e.target.checked?'待办已完成':'待办已恢复');if(e.target.id==='fileInput'&&e.target.files?.length)setTimeout(()=>notify('备份文件已处理'),250)},false);
window.addEventListener('error',()=>notify('页面出现异常，请保留数据备份后重试','error'));
})();
</script><script>
(()=>{'use strict';
const DATA_KEY='offerflow_v01_data';let calendarCursor=new Date();calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth(),1);
const pad=n=>String(n).padStart(2,'0');const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tasksData=()=>{try{const value=JSON.parse(localStorage.getItem(DATA_KEY));return Array.isArray(value?.tasks)?value.tasks:[]}catch(e){return []}};
function calendarMarkup(){const year=calendarCursor.getFullYear(),month=calendarCursor.getMonth(),first=new Date(year,month,1),lead=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate(),cells=Math.ceil((lead+days)/7)*7,start=new Date(year,month,1-lead),today=dateKey(new Date()),tasks=tasksData(),byDate=new Map();for(const task of tasks){if(!task.due)continue;if(!byDate.has(task.due))byDate.set(task.due,[]);byDate.get(task.due).push(task)}let grid='';for(let i=0;i<cells;i++){const day=new Date(start);day.setDate(start.getDate()+i);const key=dateKey(day),items=byDate.get(key)||[],other=day.getMonth()!==month,dots=items.map(task=>`<i class="calendar-dot${task.done?' done':''}"></i>`).join(''),title=items.length?` title="${safe(items.map(task=>task.text).join('、'))}"`:'';grid+=`<div class="calendar-day${other?' other':''}${key===today?' today':''}${items.length?' has-tasks':''}" aria-label="${key}${items.length?'，'+items.length+'项待办':''}"${title}><span class="calendar-date">${day.getDate()}</span><span class="calendar-dots" aria-hidden="true">${dots}</span></div>`}const prefix=`${year}-${pad(month+1)}`,monthTasks=tasks.filter(task=>task.due?.startsWith(prefix)),pending=monthTasks.filter(task=>!task.done).length;return `<div class="calendar-head"><h2>${year} 年 ${month+1} 月</h2><div class="calendar-actions"><button class="calendar-nav" type="button" data-calendar-nav="prev" aria-label="上个月">‹</button><button class="calendar-nav calendar-today" type="button" data-calendar-nav="today">本月</button><button class="calendar-nav" type="button" data-calendar-nav="next" aria-label="下个月">›</button></div></div><div class="calendar-week" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="calendar-grid">${grid}</div><div class="calendar-legend"><span><i></i>未完成</span><span class="done-key"><i></i>已完成</span></div><div class="calendar-summary">本月共 ${monthTasks.length} 项待办，其中 ${pending} 项未完成。每个圆点代表一项待办。</div>`}
function renderCalendar(){const panel=document.querySelector('.calendar-panel');if(panel)panel.innerHTML=calendarMarkup()}
function mountCalendar(){const content=document.querySelector('#content'),rows=document.querySelector('#taskRows'),toolbar=content?.querySelector(':scope > .toolbar');if(!content||!rows)return;let layout=content.querySelector(':scope > .tasks-layout');if(!layout){layout=document.createElement('div');layout.className='tasks-layout';const main=document.createElement('div');main.className='tasks-main';const panel=document.createElement('aside');panel.className='panel calendar-panel';panel.setAttribute('aria-label','待办日历');content.insertBefore(layout,toolbar||rows);layout.append(main,panel);if(toolbar)main.appendChild(toolbar);main.appendChild(rows)}renderCalendar()}
document.addEventListener('click',event=>{const button=event.target.closest('[data-calendar-nav]');if(!button)return;const action=button.dataset.calendarNav;if(action==='today'){const now=new Date();calendarCursor=new Date(now.getFullYear(),now.getMonth(),1)}else calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+(action==='next'?1:-1),1);renderCalendar()});
const content=document.querySelector('#content');if(content)new MutationObserver(()=>queueMicrotask(mountCalendar)).observe(content,{childList:true});mountCalendar();
})();
</script></body></html>
